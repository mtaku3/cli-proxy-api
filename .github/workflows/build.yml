name: build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          upstream=$(sed -n 's/^ARG CLIPROXYAPI_VERSION=//p' Dockerfile)
          {
            echo "upstream=$upstream"
            echo "sha=$(git rev-parse --short=8 HEAD)"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            COMMIT=${{ steps.version.outputs.sha }}
            BUILD_DATE=${{ steps.version.outputs.date }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/mtaku3/cli-proxy-api:latest
            ghcr.io/mtaku3/cli-proxy-api:${{ steps.version.outputs.upstream }}
            ghcr.io/mtaku3/cli-proxy-api:${{ steps.version.outputs.upstream }}-${{ steps.version.outputs.sha }}
