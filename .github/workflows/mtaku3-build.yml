name: mtaku3 build

on:
  push:
    branches:
      - mtaku3
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          git fetch --no-tags https://github.com/router-for-me/CLIProxyAPI.git 'refs/tags/v*:refs/tags/v*'
          {
            echo "upstream=$(git describe --tags --abbrev=0 --match 'v*' HEAD)"
            echo "sha=$(git rev-parse --short HEAD)"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./internal/access/... ./sdk/access/...

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.upstream }}-mtaku3
            COMMIT=${{ steps.version.outputs.sha }}
            BUILD_DATE=${{ steps.version.outputs.date }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/mtaku3/cli-proxy-api:latest
            ghcr.io/mtaku3/cli-proxy-api:${{ steps.version.outputs.upstream }}
            ghcr.io/mtaku3/cli-proxy-api:${{ steps.version.outputs.upstream }}-${{ steps.version.outputs.sha }}
